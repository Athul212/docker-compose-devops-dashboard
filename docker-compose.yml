services:

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: devops-nginx
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - frontend-network
      - backend-network

  backend:
    build: ./app
    container_name: devops-backend
    environment:
      DB_HOST: database
      DB_NAME: devops
      DB_USER: devops
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend-network
      - backend-network

  database:
    image: postgres:16-alpine
    container_name: devops-database
    environment:
      POSTGRES_DB: devops
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devops"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

networks:
  frontend-network:
  backend-network:

volumes:
  postgres_data:
